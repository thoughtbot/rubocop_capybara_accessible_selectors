CapybaraAccessibleSelectors/PreferAccessibleSelector:
  Description: >-
    Prefer capybara_accessible_selectors semantic selectors (`:heading`,
    `:modal`, `:navigation`, ...) over raw CSS selectors in Capybara tests.
  Enabled: true
  Include:
    - "**/spec/**/*_spec.rb"
    - "**/test/**/*_test.rb"
    - "**/spec/support/**/*.rb"
  TestIdAttribute: data-testid
  VersionAdded: "0.1.0"

CapybaraAccessibleSelectors/NonAccessibleSelector:
  Description: >-
    Avoid CSS, XPath, id and class locators in Capybara tests; locate
    elements by role and accessible name instead.
  Enabled: false
  Include:
    - "**/spec/**/*_spec.rb"
    - "**/test/**/*_test.rb"
    - "**/spec/support/**/*.rb"
  VersionAdded: "0.1.0"
